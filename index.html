<style>
:root{--bg:#f6f8fb;--surface:#fff;--text:#0f1b2d;--muted:#55627a;--line:#dde3ee;--brand:#0b2545;--accent:#e8a317;--on-brand:#fff;--hero1:#0b2545;--hero2:#13407a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#121c30;--text:#eaf0fa;--muted:#9fb0cb;--line:#25324d;--brand:#0a1a33;--hero1:#08142a;--hero2:#103a70}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#121c30;--text:#eaf0fa;--muted:#9fb0cb;--line:#25324d;--brand:#0a1a33;--hero1:#08142a;--hero2:#103a70}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:60}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding:12px 0;margin-bottom:-80px;pointer-events:none}.bar>*{pointer-events:auto}
.bar{display:flex;align-items:center;height:56px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;height:56px;padding:0 22px;border-radius:999px;background:var(--brand);border:1px solid rgba(255,255,255,.12);font-weight:800;font-size:19px;letter-spacing:.3px;color:#fff;text-decoration:none}.logo::before{content:"";width:12px;height:12px;border-radius:50%;border:3px solid var(--accent)}
.logo span{color:var(--accent)}
nav{display:flex;align-items:center;gap:4px;height:56px;padding:6px;margin-left:auto;border-radius:999px;background:var(--brand);border:1px solid rgba(255,255,255,.12)}
nav a{color:#9fb0cb;text-decoration:none;font-size:15px;padding:10px 16px;border-radius:999px;transition:.2s}
nav a:hover{color:#fff;background:rgba(255,255,255,.06)}nav a.act{color:#fff;font-weight:700;background:rgba(255,255,255,.12)}.go{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 24px;border-radius:999px;background:var(--accent);color:#1a1200;font-weight:700;font-size:15px;text-decoration:none}.go b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-size:18px;transition:transform .25s}.go:hover b{transform:translateX(3px)}@media (max-width:1060px){.go{display:none}}
.lang{display:flex;gap:4px;margin-left:6px}
.lang button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 9px;border-radius:8px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--accent);border-color:var(--accent);color:#1a1200;font-weight:700}
.burger{display:none;background:var(--brand);border:1px solid rgba(255,255,255,.12);border-radius:50%;width:56px;height:56px;cursor:pointer;padding:0;position:relative}
.burger i{position:absolute;left:18px;right:18px;height:2px;background:#fff;border-radius:2px;transition:.25s}
.burger i:nth-child(1){top:19px}.burger i:nth-child(2){top:26px}.burger i:nth-child(3){top:33px}
.burger.open i:nth-child(1){top:26px;transform:rotate(45deg)}
.burger.open i:nth-child(2){opacity:0}
.burger.open i:nth-child(3){top:26px;transform:rotate(-45deg)}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:164px 0 92px}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.12;margin:0 0 18px;max-width:760px}
.hero p{font-size:clamp(16px,2vw,19px);max-width:640px;color:#cfdcf1;margin:0 0 30px}
.btn{display:inline-block;background:var(--accent);color:#1a1200;font-weight:700;padding:14px 26px;border-radius:12px;text-decoration:none;border:0;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);margin-left:10px}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:44px}
.stats b{display:block;font-size:26px;color:var(--accent)}
.stats span{font-size:14px;color:#cfdcf1}
section{padding:72px 0}
h2{font-size:clamp(26px,3.4vw,36px);margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 36px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .ic{width:52px;height:52px;border-radius:14px;background:rgba(232,163,23,.14);color:var(--accent);display:grid;place-items:center;margin-bottom:14px}.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0 0 8px;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:15px}
.alt{background:var(--surface);border-block:1px solid var(--line)}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.why div{padding:6px 0}
.why b{display:block;font-size:17px;margin-bottom:6px}
.why p{margin:0;color:var(--muted);font-size:15px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#1a1200;font-weight:800;margin-bottom:12px}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:15px}
.faq{max-width:820px;display:grid;gap:12px}.qa{background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .3s,box-shadow .3s}.qa.open{border-color:var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.1)}.q{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 22px;cursor:pointer;font-weight:600;font-size:17px;color:var(--text)}.q:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:16px}.q i{flex:none;position:relative;width:30px;height:30px;border-radius:50%;background:var(--bg);transition:transform .4s cubic-bezier(.4,0,.2,1),background .3s,color .3s}.q i::before,.q i::after{content:"";position:absolute;background:currentColor;border-radius:2px;transition:transform .4s cubic-bezier(.4,0,.2,1)}.q i::before{left:8px;right:8px;top:14px;height:2px}.q i::after{top:8px;bottom:8px;left:14px;width:2px}.qa.open .q i{transform:rotate(180deg);background:var(--accent);color:#1a1200}.qa.open .q i::after{transform:scaleY(0)}.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}.qa.open .a{grid-template-rows:1fr}.a>div{overflow:hidden}.a p{margin:0;padding:0 22px 22px;color:var(--muted);opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .45s}.qa.open .a p{opacity:1;transform:none;transition-delay:.1s}.contact{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start}
.info p{margin:0 0 12px;color:var(--muted)}
.info a{color:var(--text);font-weight:600;text-decoration:none}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
textarea{min-height:100px;resize:vertical}
form .btn{width:100%}
footer{background:var(--brand);color:#9fb0cb;padding:26px 0;font-size:14px;text-align:center}
@media (max-width:860px){
 .burger{display:block;margin-left:auto}
 nav{position:fixed;left:16px;right:16px;top:calc(80px + env(safe-area-inset-top,0px));height:auto;margin:0;border-radius:24px;flex-direction:column;align-items:stretch;gap:2px;padding:8px 10px 16px;max-height:0;overflow:hidden;opacity:0;pointer-events:none!important;transition:.3s;box-shadow:0 12px 24px rgba(0,0,0,.35)}
 nav.open{max-height:80vh;opacity:1;pointer-events:auto!important}
 nav a{padding:14px 16px;font-size:17px}
 .lang{margin-top:14px}
 .grid,.why,.steps,.contact{grid-template-columns:1fr}
 .hero{padding:136px 0 64px}
 section{padding:52px 0}
 .btn.ghost{margin:10px 0 0}
}
@media (min-width:600px) and (max-width:860px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
